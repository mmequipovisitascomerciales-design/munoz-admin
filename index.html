<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Muñoz Marchesi — Panel de Gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --blue:      #3767A6;
  --blue-dark: #1e3d6e;
  --blue-pale: #dce8f7;
  --green:     #32A62E;
  --green-dark:#1d8a1a;
  --red:       #C0392B;
  --yellow:    #c8a000;
  --white:     #FFFFFF;
  --bg:        #F0F2F6;
  --sidebar:   #1a2540;
  --border:    #D8DCE8;
  --text-1:    #0D1520;
  --text-2:    #3A4560;
  --text-3:    #8090AA;
  --off-white: #F8F9FB;
  --shadow:    0 2px 8px rgba(0,0,0,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text-1);font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
a{text-decoration:none;color:inherit}

/* ── LOGIN ── */
#login-screen {
  position:fixed;inset:0;background:var(--blue-dark);
  display:flex;align-items:center;justify-content:center;z-index:1000;
}
.login-box {
  background:var(--white);padding:48px 40px;width:380px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.login-logo {
  font-size:22px;font-weight:800;color:var(--blue);
  letter-spacing:-.02em;margin-bottom:8px;
}
.login-sub {font-size:13px;color:var(--text-3);margin-bottom:32px}
.login-field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.login-field label{font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em}
.login-field input{height:42px;padding:0 14px;border:1.5px solid var(--border);background:var(--off-white);outline:none;font-size:14px}
.login-field input:focus{border-color:var(--blue)}
.btn-login{width:100%;height:44px;background:var(--blue);color:#fff;font-size:14px;font-weight:700;margin-top:8px;transition:background .15s}
.btn-login:hover{background:var(--blue-dark)}
.login-error{color:var(--red);font-size:13px;margin-top:8px;display:none;text-align:center}

/* ── LAYOUT ── */
#app{display:none;height:100vh;flex-direction:row}
#app.visible{display:flex}

/* Sidebar */
.sidebar{
  width:220px;background:var(--sidebar);flex-shrink:0;
  display:flex;flex-direction:column;overflow:hidden;
}
.sidebar-logo{
  padding:24px 20px;border-bottom:1px solid rgba(255,255,255,.08);
}
.sidebar-logo-name{font-size:15px;font-weight:800;color:#fff;letter-spacing:-.01em}
.sidebar-logo-sub{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px}
.sidebar-user{
  padding:12px 20px;border-bottom:1px solid rgba(255,255,255,.08);
  font-size:12px;color:rgba(255,255,255,.5);
}
.sidebar-user span{color:#fff;font-weight:600}
.sidebar-nav{flex:1;padding:12px 0;overflow-y:auto}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 20px;cursor:pointer;
  font-size:13px;font-weight:500;color:rgba(255,255,255,.55);
  transition:background .15s,color .15s;
  border-left:3px solid transparent;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.85)}
.nav-item.active{background:rgba(55,103,166,.3);color:#fff;border-left-color:var(--blue)}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.7}
.nav-item.active svg{opacity:1}
.nav-section-label{
  padding:16px 20px 6px;font-size:10px;font-weight:700;
  color:rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:.1em;
}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08)}
.btn-logout{
  font-size:12px;color:rgba(255,255,255,.4);
  display:flex;align-items:center;gap:8px;cursor:pointer;
}
.btn-logout:hover{color:rgba(255,255,255,.7)}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{
  height:56px;background:var(--white);border-bottom:1.5px solid var(--border);
  display:flex;align-items:center;padding:0 28px;
  flex-shrink:0;gap:12px;
}
.topbar-title{font-size:18px;font-weight:700;color:var(--text-1);flex:1}
.content{flex:1;overflow-y:auto;padding:28px}

/* ── CARDS ── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{
  background:var(--white);padding:20px 24px;
  border:1.5px solid var(--border);
}
.stat-label{font-size:12px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em}
.stat-value{font-size:32px;font-weight:800;color:var(--text-1);margin-top:6px;letter-spacing:-.02em}
.stat-sub{font-size:12px;color:var(--text-3);margin-top:4px}

/* ── TABLE ── */
.table-card{background:var(--white);border:1.5px solid var(--border)}
.table-header{
  padding:16px 20px;border-bottom:1.5px solid var(--border);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.table-header-title{font-size:15px;font-weight:700;color:var(--text-1);flex:1}
.search-input{
  height:36px;padding:0 12px;border:1.5px solid var(--border);
  background:var(--off-white);font-size:13px;width:220px;outline:none;
}
.search-input:focus{border-color:var(--blue)}
.filter-select{
  height:36px;padding:0 10px;border:1.5px solid var(--border);
  background:var(--off-white);font-size:13px;outline:none;cursor:pointer;
}
.btn-primary{
  height:36px;padding:0 16px;background:var(--blue);color:#fff;
  font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;
  transition:background .15s;white-space:nowrap;
}
.btn-primary:hover{background:var(--blue-dark)}
.btn-primary svg{width:14px;height:14px}
.btn-sm{
  height:30px;padding:0 12px;font-size:12px;font-weight:600;
  display:inline-flex;align-items:center;gap:4px;transition:all .15s;
}
.btn-edit{background:var(--blue-pale);color:var(--blue)}
.btn-edit:hover{background:var(--blue);color:#fff}
.btn-danger{background:#fdecea;color:var(--red)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-success{background:#eafbec;color:var(--green-dark)}
.btn-success:hover{background:var(--green);color:#fff}

table{width:100%;border-collapse:collapse}
thead{background:var(--off-white)}
th{
  padding:10px 16px;text-align:left;
  font-size:11px;font-weight:700;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.06em;
  border-bottom:1.5px solid var(--border);white-space:nowrap;
}
td{
  padding:12px 16px;border-bottom:1px solid var(--border);
  font-size:13px;color:var(--text-1);vertical-align:middle;
}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--off-white)}
.td-actions{display:flex;gap:6px;align-items:center}
.badge{
  display:inline-flex;align-items:center;
  padding:3px 10px;font-size:11px;font-weight:600;
  border-radius:0;
}
.badge-active{background:#eafbec;color:var(--green-dark)}
.badge-inactive{background:#fdecea;color:var(--red)}
.badge-conectado{background:#eafbec;color:var(--green-dark)}
.badge-desconectado{background:var(--off-white);color:var(--text-3)}

/* ── MODAL ── */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
  z-index:500;align-items:center;justify-content:center;
}
.modal-overlay.open{display:flex}
.modal{
  background:var(--white);width:560px;max-height:90vh;
  display:flex;flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}
.modal-header{
  padding:20px 24px;border-bottom:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.modal-title{font-size:16px;font-weight:700}
.modal-close{
  width:32px;height:32px;background:var(--off-white);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-size:18px;color:var(--text-3);
}
.modal-close:hover{background:var(--border)}
.modal-body{padding:24px;overflow-y:auto;flex:1}
.modal-footer{
  padding:16px 24px;border-top:1.5px solid var(--border);
  display:flex;justify-content:flex-end;gap:10px;flex-shrink:0;
}

/* Form */
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.form-group label{font-size:12px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em}
.form-group input,.form-group select,.form-group textarea{
  height:40px;padding:0 12px;border:1.5px solid var(--border);
  background:var(--off-white);font-size:13px;color:var(--text-1);outline:none;width:100%;
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--blue)}
.form-group textarea{height:auto;padding:10px 12px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* Chart */
.chart-card{background:var(--white);border:1.5px solid var(--border);padding:24px;margin-bottom:24px}
.chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.chart-title{font-size:15px;font-weight:700}
.chart-filters{display:flex;gap:8px;align-items:center}
.date-input{height:34px;padding:0 10px;border:1.5px solid var(--border);font-size:12px;outline:none}
.date-input:focus{border-color:var(--blue)}

/* Toggle */
.toggle{position:relative;display:inline-block;width:40px;height:22px}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{
  position:absolute;inset:0;background:#ccc;cursor:pointer;transition:.3s;
}
.toggle-slider:before{
  content:"";position:absolute;height:16px;width:16px;
  left:3px;bottom:3px;background:white;transition:.3s;
}
.toggle input:checked + .toggle-slider{background:var(--green)}
.toggle input:checked + .toggle-slider:before{transform:translateX(18px)}

/* Pagination */
.pagination{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1.5px solid var(--border)}
.page-info{font-size:12px;color:var(--text-3)}
.page-btns{display:flex;gap:4px}
.page-btn{
  height:30px;width:30px;display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--border);font-size:12px;cursor:pointer;background:var(--white);
}
.page-btn:hover,.page-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}

/* Toast */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:999;
  background:var(--text-1);color:#fff;padding:12px 20px;
  font-size:13px;font-weight:500;display:none;
  box-shadow:0 4px 16px rgba(0,0,0,.2);
  animation:slideIn .3s ease;
}
.toast.show{display:block}
.toast.success{background:var(--green-dark)}
.toast.error{background:var(--red)}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* Empty state */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-3)}
.empty-state svg{width:48px;height:48px;opacity:.2;margin-bottom:12px}
.empty-state p{font-size:14px}

/* Print */
@media print {
  .sidebar,.topbar,.modal-overlay,.toast{display:none!important}
  .content{padding:0}
  body{background:white}
}
</style>
</head>

        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Cerrar sesión
      </div>
    </div>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbar-title">Dashboard</div>

<!-- MODAL -->

  <div class="modal" id="modal">
    <div class="modal-header">

    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════
const SB_URL = "https://ncagcvtkporoapumenoo.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jYWdjdnRrcG9yb2FwdW1lbm9vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NDA4Mjg0NCwiZXhwIjoyMDk5NjU4ODQ0fQ.raziKoLpfqAgEvFvyQ9KaP2weKkGL_ksyWwEYQmX2Vc";

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
let currentUser = null;
let articulosData = [], categorias = [], sucursales = [], vendedores = [];
let artPage = 1, artPageSize = 20;
let artFilter = { search:'', categoria:'', activo:'' };
let chartInstance = null;

// ══════════════════════════════════════════════
// SUPABASE HELPERS
// ══════════════════════════════════════════════
async function sb(path, opts={}) {
  const res = await fetch(`${SB_URL}/rest/v1/${path}`, {
    headers: {
      'apikey': SB_KEY,
      'Authorization': `Bearer ${SB_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || '',
      ...(opts.headers||{})
    },
    method: opts.method || 'GET',
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok) { const e = await res.text(); throw new Error(e); }
  if (res.status === 204) return null;
  return res.json();
}

// ══════════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════════
async function doLogin() {
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value.trim();
  if (!user || !pass) return;
  try {
    const res = await sb(`usuarios_admin?username=eq.${encodeURIComponent(user)}&password=eq.${encodeURIComponent(pass)}&activo=eq.true&select=*`);
    if (!res || res.length === 0) {
      document.getElementById('login-error').style.display = 'block'; return;
    }
    currentUser = res[0];
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').classList.add('visible');
    document.getElementById('sidebar-username').textContent = currentUser.username + (currentUser.rol === 'admin' ? ' (admin)' : '');
    // Hide admin sections if not admin
    if (currentUser.rol !== 'admin') {
      document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
    }
    await loadBaseData();
    showSection('dashboard');
  } catch(e) {
    document.getElementById('login-error').style.display = 'block';
  }
}

function doLogout() {
  currentUser = null;
  document.getElementById('app').classList.remove('visible');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-user').value = '';
  document.getElementById('login-pass').value = '';
  document.getElementById('login-error').style.display = 'none';
}

document.getElementById('login-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
document.getElementById('login-user').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

// ══════════════════════════════════════════════
// BASE DATA
// ══════════════════════════════════════════════
async function loadBaseData() {
  [categorias, sucursales, vendedores] = await Promise.all([
    sb('categorias?select=*&order=orden.asc'),
    sb('sucursales?select=*&order=nombre.asc'),
    sb('vendedores?select=*&order=nombre.asc'),
  ]);
}

// ══════════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════════
function showSection(section) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav-'+section);
  if (navEl) navEl.classList.add('active');
  const titles = {
    dashboard:'Dashboard', articulos:'Artículos', video:'Video de portada', importar:'Importar desde Excel', presupuestos:'Presupuestos',
    sucursales:'Sucursales', vendedores:'Vendedores', usuarios:'Usuarios de Gestión'
  };
  document.getElementById('topbar-title').textContent = titles[section] || section;
  const content = document.getElementById('content');
  content.innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-3)">Cargando...</div>';
  const fns = {
    dashboard: renderDashboard, articulos: renderArticulos, video: renderVideo, 'portada-web': renderPortadaWeb, importar: renderImportar, apk: renderApk,
    presupuestos: renderPresupuestos, sucursales: renderSucursales,
    vendedores: renderVendedores, usuarios: renderUsuarios,
  };
  if (fns[section]) fns[section]();
}

// ══════════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════════
async function renderDashboard() {
  const content = document.getElementById('content');
  const today = new Date().toISOString().split('T')[0];
  const thirtyAgo = new Date(Date.now()-30*86400000).toISOString().split('T')[0];

  const [arts, presups] = await Promise.all([
    sb('articulos?select=activo'),
    sb(`presupuestos?select=id,fecha,total&fecha=gte.${thirtyAgo}T00:00:00&order=fecha.asc`),
  ]);

  const artActivos   = arts.filter(a=>a.activo).length;
  const artInactivos = arts.filter(a=>!a.activo).length;
  const totalPresups = presups.length;
  const totalVentas  = presups.reduce((s,p)=>s+(parseFloat(p.total)||0),0);

  // Group by day for chart
  const byDay = {};
  presups.forEach(p => {
    const d = p.fecha?.split('T')[0];
    if (d) byDay[d] = (byDay[d]||0) + 1;
  });
  const days = Object.keys(byDay).sort();
  const counts = days.map(d=>byDay[d]);

  content.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Artículos activos</div>
        <div class="stat-value">${artActivos}</div>
        <div class="stat-sub">${artInactivos} inactivos</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Presupuestos (30d)</div>
        <div class="stat-value">${totalPresups}</div>
        <div class="stat-sub">últimos 30 días</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Volumen estimado (30d)</div>
        <div class="stat-value" style="font-size:22px">$${Math.round(totalVentas).toLocaleString('es-AR')}</div>
        <div class="stat-sub">suma de presupuestos</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Sucursales activas</div>
        <div class="stat-value">${sucursales.filter(s=>s.activa).length}</div>
        <div class="stat-sub">de ${sucursales.length} totales</div>
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-header">
        <div class="chart-title">Presupuestos por día</div>
        <div class="chart-filters">
          <label style="font-size:12px;color:var(--text-3)">Desde</label>
          <input type="date" class="date-input" id="chart-from" value="${thirtyAgo}">
          <label style="font-size:12px;color:var(--text-3)">Hasta</label>
          <input type="date" class="date-input" id="chart-to" value="${today}">
          <button class="btn-primary" onclick="refreshChart()">Filtrar</button>
        </div>
      </div>
      <canvas id="presupuestos-chart" height="80"></canvas>
    </div>
  `;

  // Render chart
  renderChart(days, counts);
}

function renderChart(labels, data) {
  if (chartInstance) chartInstance.destroy();
  const ctx = document.getElementById('presupuestos-chart');
  if (!ctx) return;
  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels.map(d => {
        const [y,m,day] = d.split('-');
        return `${day}/${m}`;
      }),
      datasets: [{
        label: 'Presupuestos',
        data: data,
        backgroundColor: '#3767A6',
        borderColor: '#1e3d6e',
        borderWidth: 1,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, ticks: { stepSize: 1 } }
      }
    }
  });
}

async function refreshChart() {
  const from = document.getElementById('chart-from').value;
  const to   = document.getElementById('chart-to').value;
  const presups = await sb(`presupuestos?select=id,fecha&fecha=gte.${from}T00:00:00&fecha=lte.${to}T23:59:59&order=fecha.asc`);
  const byDay = {};
  presups.forEach(p => {
    const d = p.fecha?.split('T')[0];
    if (d) byDay[d] = (byDay[d]||0)+1;
  });
  const days = Object.keys(byDay).sort();
  renderChart(days, days.map(d=>byDay[d]));
}

// ══════════════════════════════════════════════
// ARTÍCULOS
// ══════════════════════════════════════════════
async function renderArticulos() {
  artPage = 1;
  const catOptions = categorias.map(c=>`<option value="${c.clave}">${c.label}</option>`).join('');
  document.getElementById('content').innerHTML = `
    <div class="table-card">
      <div class="table-header">
        <div class="table-header-title">Artículos</div>
        <input class="search-input" id="art-search" placeholder="Buscar nombre o código…" oninput="filterArticulos()"/>
        <select class="filter-select" id="art-cat" onchange="filterArticulos()">
          <option value="">Todas las categorías</option>
          ${catOptions}
        </select>
        <select class="filter-select" id="art-activo" onchange="filterArticulos()">
          <option value="">Todos</option>
          <option value="true">Activos</option>
          <option value="false">Inactivos</option>
        </select>
      </div>
      <div id="art-table-wrap"><div style="text-align:center;padding:40px;color:var(--text-3)">Cargando artículos...</div></div>
      <div class="pagination" id="art-pagination"></div>
    </div>
  `;
  await loadArticulos();
}

async function loadArticulos() {
  let query = 'articulos?select=*&order=nombre_original.asc&limit=5000';
  const res = await sb(query);
  articulosData = res || [];
  filterArticulos();
}

function filterArticulos() {
  artFilter.search   = document.getElementById('art-search')?.value.toLowerCase()||'';
  artFilter.categoria= document.getElementById('art-cat')?.value||'';
  artFilter.activo   = document.getElementById('art-activo')?.value||'';
  artPage = 1;
  renderArticulosTable();
}

function renderArticulosTable() {
  let filtered = articulosData.filter(a => {
    const q = artFilter.search;
    const matchSearch = !q || (a.nombre_original||'').toLowerCase().includes(q) ||
      (a.nombre_custom||'').toLowerCase().includes(q) || String(a.codigo).includes(q);
    const matchCat = !artFilter.categoria || a.categoria_clave === artFilter.categoria;
    const matchActivo = artFilter.activo === '' || String(a.activo) === artFilter.activo;
    return matchSearch && matchCat && matchActivo;
  });

  const total = filtered.length;
  const pages = Math.ceil(total / artPageSize);
  const start = (artPage-1)*artPageSize;
  const page  = filtered.slice(start, start+artPageSize);

  const catMap = {};
  categorias.forEach(c => catMap[c.clave] = c.label);

  const rows = page.map(a => `
    <tr>
      <td style="font-size:11px;color:var(--text-3)">${formatCodigo(a.codigo)}</td>
      <td>
        <div style="font-weight:600">${a.nombre_custom || a.nombre_original}</div>
        ${a.nombre_custom ? `<div style="font-size:11px;color:var(--text-3)">${a.nombre_original}</div>` : ''}
      </td>
      <td>${catMap[a.categoria_clave]||a.categoria_clave||'—'}</td>
      <td>$${Math.round(a.precio||0).toLocaleString('es-AR')}</td>
      <td>${a.stock??'—'}</td>
      <td><span class="badge ${a.activo?'badge-active':'badge-inactive'}">${a.activo?'Activo':'Inactivo'}</span></td>
      <td class="td-actions">
        <button class="btn-sm btn-edit" onclick="editArticulo('${a.codigo}')">Editar</button>
        <button class="btn-sm ${a.activo?'btn-danger':'btn-success'}" onclick="toggleArticulo('${a.codigo}',${a.activo})">
          ${a.activo?'Desactivar':'Activar'}
        </button>
      </td>
    </tr>
  `).join('');

  document.getElementById('art-table-wrap').innerHTML = `
    <table>
      <thead><tr>
        <th>Código</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Estado</th><th>Acciones</th>
      </tr></thead>
      <tbody>${rows || '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-3)">Sin resultados</td></tr>'}</tbody>
    </table>
  `;

  // Pagination
  let pagBtns = '';
  for (let i=1; i<=Math.min(pages,10); i++) {
    pagBtns += `<div class="page-btn ${i===artPage?'active':''}" onclick="goArtPage(${i})">${i}</div>`;
  }
  document.getElementById('art-pagination').innerHTML = `
    <div class="page-info">${total} artículos — pág ${artPage} de ${pages||1}</div>
    <div class="page-btns">
      <div class="page-btn" onclick="goArtPage(${artPage-1})">‹</div>
      ${pagBtns}
      <div class="page-btn" onclick="goArtPage(${artPage+1})">›</div>
    </div>
  `;
}

function goArtPage(p) {
  const filtered = articulosData.filter(a => {
    const q = artFilter.search;
    const matchSearch = !q || (a.nombre_original||'').toLowerCase().includes(q) || String(a.codigo).includes(q);
    const matchCat = !artFilter.categoria || a.categoria_clave === artFilter.categoria;
    const matchActivo = artFilter.activo === '' || String(a.activo) === artFilter.activo;
    return matchSearch && matchCat && matchActivo;
  });
  const pages = Math.ceil(filtered.length/artPageSize);
  if (p<1||p>pages) return;
  artPage = p;
  renderArticulosTable();
}

function editArticulo(codigo) {
  const a = articulosData.find(x=>x.codigo===codigo);
  if (!a) return;
  const catOptions = categorias.map(c=>
    `<option value="${c.clave}" ${a.categoria_clave===c.clave?'selected':''}>${c.label}</option>`
  ).join('');
  openModal('Editar artículo', `
    <div class="form-group">
      <label>Código</label>
      <input value="${formatCodigo(a.codigo)}" disabled style="background:#eee"/>
    </div>
    <div class="form-group">
      <label>Nombre original</label>
      <input value="${esc(a.nombre_original)}" disabled style="background:#eee;font-size:12px"/>
    </div>
    <div class="form-group">
      <label>Nombre personalizado</label>
      <input id="e-nombre" value="${esc(a.nombre_custom||'')}" placeholder="Dejar vacío para usar nombre original"/>
    </div>
    <div class="form-group">
      <label>Categoría</label>
      <select id="e-cat">${catOptions}</select>
    </div>
    <div class="form-group">
      <label>Descripción</label>
      <textarea id="e-desc" rows="4" placeholder="Descripción del artículo…">${esc(a.descripcion||'')}</textarea>
    </div>
    <div style="display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start">
      <div>
        <div class="form-group">
          <label>URL de imagen</label>
          <input id="e-img" value="${esc(a.imagen_url||'')}" placeholder="https://... o subí una imagen" oninput="previewArticuloImg()"/>
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:-8px">
          <span style="font-size:12px;color:var(--text-3)">o</span>
          <label style="cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;background:var(--off-white);border:1.5px solid var(--border);font-size:12px;font-weight:600;color:var(--text-2)">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
            Subir imagen
            <input type="file" id="img-upload-input" accept="image/*" style="display:none" onchange="subirImagenArticulo()"/>
          </label>
          <span id="img-upload-status" style="font-size:12px;color:var(--text-3)"></span>
        </div>
      </div>
      <div>
        <div style="font-size:12px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Vista previa</div>
        <div style="width:160px;height:160px;border:1.5px solid var(--border);background:var(--off-white);display:flex;align-items:center;justify-content:center;overflow:hidden" id="img-preview-wrap">
          ${a.imagen_url ? `<img src="${esc(a.imagen_url)}" style="width:100%;height:100%;object-fit:contain"/>` : `<span style="color:var(--text-3);font-size:12px;text-align:center;padding:8px">Sin imagen</span>`}
        </div>
      </div>
    </div>
    <div class="form-group">
      <label>Estado</label>
      <select id="e-activo">
        <option value="true" ${a.activo?'selected':''}>Activo</option>
        <option value="false" ${!a.activo?'selected':''}>Inactivo</option>
      </select>
    </div>
  `, [
    { label:'Cancelar', cls:'btn-sm', action: closeModal },
    { label:'Guardar cambios', cls:'btn-sm btn-edit', action: ()=>saveArticulo(codigo) },
  ]);
}

async function saveArticulo(codigo) {
  const payload = {
    nombre_custom:  document.getElementById('e-nombre').value.trim() || null,
    categoria_clave:document.getElementById('e-cat').value,
    descripcion:    document.getElementById('e-desc').value.trim() || null,
    imagen_url:     document.getElementById('e-img').value.trim() || null,
    activo:         document.getElementById('e-activo').value === 'true',
  };
  await sb(`articulos?codigo=eq.${codigo}`, {method:'PATCH', body:payload, prefer:'return=minimal'});
  const idx = articulosData.findIndex(a=>a.codigo===codigo);
  if (idx>=0) Object.assign(articulosData[idx], payload);
  closeModal();
  renderArticulosTable();
  showToast('Artículo actualizado', 'success');
}

async function toggleArticulo(codigo, current) {
  await sb(`articulos?codigo=eq.${codigo}`, {method:'PATCH', body:{activo:!current}, prefer:'return=minimal'});
  const idx = articulosData.findIndex(a=>a.codigo===codigo);
  if (idx>=0) articulosData[idx].activo = !current;
  renderArticulosTable();
  showToast(!current ? 'Artículo activado' : 'Artículo desactivado', 'success');
}



async function renderApk() {
  // Load current APK info
  let currentVersion = '', currentUrl = '';
  try {
    const res = await sb('config_app?select=clave,valor&clave=in.(app_apk_version,app_apk_url)');
    const map = {};
    (res||[]).forEach(r=>map[r.clave]=r.valor);
    currentVersion = map['app_apk_version'] || '';
    currentUrl     = map['app_apk_url']     || '';
  } catch(e) { console.error(e); }

  document.getElementById('content').innerHTML = `
    <div style="max-width:600px">
      <div class="table-card" style="padding:24px">
        <div style="font-size:15px;font-weight:700;margin-bottom:20px">App Android — Gestión de versiones</div>
        <div style="background:var(--blue-light);border:1.5px solid var(--blue);padding:16px 20px;margin-bottom:24px;font-size:13px">
          <div style="font-weight:700;margin-bottom:4px">Versión actual en producción</div>
          <div style="font-family:monospace;font-size:16px;color:var(--blue)">${currentVersion || 'Sin versión cargada'}</div>
          ${currentUrl ? `<div style="margin-top:8px"><a href="${escAdm(currentUrl)}" style="color:var(--blue);font-size:12px">Descargar APK actual</a></div>` : ''}
        </div>
        <div class="form-group">
          <label>Nombre del archivo APK</label>
          <div style="font-size:12px;color:var(--text-3);margin-bottom:8px">El nombre debe seguir el formato: <strong>munoz-app-X.X.X.apk</strong> (ej: munoz-app-1.2.0.apk)</div>
          <input id="apk-version" placeholder="1.2.0" style="margin-bottom:8px"/>
          <div style="font-size:11px;color:var(--text-3)">Solo ingresá el número de versión (ej: 1.2.0)</div>
        </div>
        <div class="form-group">
          <label>Subir archivo APK</label>
          <label style="display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border:1.5px dashed var(--border);background:var(--off-white);cursor:pointer;font-size:13px;color:var(--text-2)">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
            <span id="apk-file-label">Seleccioná el archivo .apk</span>
            <input type="file" accept=".apk" id="apk-file-input" style="display:none" onchange="onApkFileSelected(this)"/>
          </label>
          <div id="apk-upload-status" style="font-size:12px;color:var(--text-3);margin-top:6px"></div>
        </div>
        <button class="btn-primary" onclick="subirApk()" style="width:100%;justify-content:center;height:44px">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>

}

function onApkFileSelected(input) {
  const file = input?.files?.[0];
  if(file) document.getElementById('apk-file-label').textContent = file.name;
}

async function subirApk() {
  const version = document.getElementById('apk-version').value.trim();
  const input   = document.getElementById('apk-file-input');
  const file    = input?.files?.[0];
  const status  = document.getElementById('apk-upload-status');

  if(!version) { showToast('Ingresá el número de versión','error'); return; }
  if(!file)    { showToast('Seleccioná un archivo APK','error'); return; }

  const filename = `munoz-app-${version}.apk`;
  status.textContent = 'Subiendo APK...';
  status.style.color = 'var(--text-3)';

  try {
    const url = `${SB_URL}/storage/v1/object/imagenes/${filename}`;
    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${SB_KEY}`,
        'Content-Type': 'application/octet-stream',
        'x-upsert': 'true',
      },
      body: file,
    });
    if(!res.ok) throw new Error(await res.text());

    const publicUrl = `${SB_URL}/storage/v1/object/public/imagenes/${filename}`;

    // Save version and URL to config_app
    for(const [clave, valor] of [['app_apk_version', version], ['app_apk_url', publicUrl]]) {
      const exists = await sb(`config_app?clave=eq.${clave}&select=clave`);
      if(exists?.length) {
        await sb(`config_app?clave=eq.${clave}`, {method:'PATCH', body:{valor}, prefer:'return=minimal'});
      } else {
        await sb('config_app', {method:'POST', body:{clave, valor}, prefer:'return=minimal'});
      }
    }

    status.textContent = `✓ Versión ${version} publicada`;
    status.style.color = 'var(--green)';
    showToast(`APK v${version} publicado`, 'success');
    setTimeout(() => renderApk(), 1500);
  } catch(e) {
    console.error(e);
    status.textContent = '✗ Error al subir';
    status.style.color = 'var(--red)';
    showToast('Error al publicar APK', 'error');
  }
}

let xlsxFile = null;
function onXlsxSelected(input) {
  xlsxFile = input?.files?.[0];
  if(xlsxFile) document.getElementById('xlsx-label').textContent = xlsxFile.name;

async function procesarExcel() {
  if(!xlsxFile) { showToast('Seleccioná un archivo Excel','error'); return; }
  const log = document.getElementById('import-log');
  log.style.display = 'block';
  log.textContent = 'Leyendo archivo...\n';

  try {
    // Read file as ArrayBuffer
    const buffer = await xlsxFile.arrayBuffer();
    const uint8 = new Uint8Array(buffer);

    // Parse XLSX manually (basic binary parsing for our known format)
    // Use a simple CSV-like approach via FileReader
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        // Use SheetJS via CDN
        if(!window.XLSX) {
          const script = document.createElement('script');
          script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
          document.head.appendChild(script);
          await new Promise(r => script.onload = r);
        }
        const workbook = window.XLSX.read(e.target.result, {type:'array'});
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = window.XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});

        log.textContent += `Filas encontradas: ${rows.length}\n`;

        let nuevos=0, actualizados=0, errores=0;

        for(let i=1; i<rows.length; i++) {
          const row = rows[i];
          const codigo = String(row[0]||'').trim().replace(/\.0$/,'');
          const nombre = String(row[1]||'').trim();
          const stock  = parseInt(row[3])||0;
          const precioBase = parseFloat(String(row[4]||'').replace(/[^0-9.]/g,''))||0;
                const aplicarMk = document.getElementById('aplicar-markup')?.checked;
                const precio = aplicarMk ? Math.round(precioBase * 1.05 / 500) * 500 : precioBase;
          if(!codigo||!nombre) continue;

          try {
            const exists = await sb(`articulos?codigo=eq.${codigo}&select=codigo`);
            if(exists?.length) {
              await sb(`articulos?codigo=eq.${codigo}`, {method:'PATCH', body:{precio,stock}, prefer:'return=minimal'});
              actualizados++;
            } else {
              await sb('articulos', {method:'POST', prefer:'return=minimal', body:{
                codigo, nombre_original:nombre, precio, stock,
                categoria_clave:'bazar', activo:true
              }});
              nuevos++;
            }
            log.textContent += `[${i}] ${codigo} — OK\n`;
          } catch(err) {
            errores++;
            log.textContent += `[${i}] ${codigo} — ERROR: ${err.message.slice(0,50)}\n`;
          }
          log.scrollTop = log.scrollHeight;
        }

        log.textContent += `\n✓ Completado: ${nuevos} nuevos, ${actualizados} actualizados, ${errores} errores`;
        showToast(`Importación: ${nuevos} nuevos, ${actualizados} actualizados`,'success');
      } catch(err) {
        log.textContent += 'Error: ' + err.message;
      }
    };
    reader.readAsArrayBuffer(xlsxFile);
  } catch(e) {
    log.textContent += 'Error: ' + e.message;
  }
}

async function fetchReportData() {
  const from  = document.getElementById('rep-from')?.value;
  const to    = document.getElementById('rep-to')?.value;
  const sucId = document.getElementById('rep-suc')?.value;
  const vend  = document.getElementById('rep-vend')?.value;

  let query = 'presupuestos?select=*,clientes(nombre,telefono),sucursales(nombre),presupuesto_items(*)&order=fecha.desc&limit=1000';
  if(from) query += `&fecha=gte.${from}T00:00:00`;
  if(to)   query += `&fecha=lte.${to}T23:59:59`;
  if(sucId && sucId !== 'WEB') query += `&sucursal_id=eq.${sucId}`;

  let data = await sb(query);
  if(sucId === 'WEB') data = data.filter(p=>!p.sucursal_id);
  if(vend) data = data.filter(p=>p.vendedor_nombre===vend);
  return data;
}

async function exportarExcel() {
  showToast('Generando Excel...','');
  const tipo = document.getElementById('rep-tipo')?.value;
  const data = await fetchReportData();

  if(!window.XLSX) {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    document.head.appendChild(script);
    await new Promise(r => script.onload = r);
  }

  let wb, rows, headers;

  if(tipo === 'articulos_mas_pedidos') {
    const countMap = {};
    data.forEach(p => (p.presupuesto_items||[]).forEach(i => {
      const k = i.codigo_articulo + '|' + i.nombre;
      countMap[k] = (countMap[k]||0) + i.cantidad;
    }));
    headers = ['Código','Artículo','Total presupuestado'];
    rows = Object.entries(countMap).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{
      const [cod,nom] = k.split('|');
      return [cod, nom, v];
    });
  } else if(tipo === 'por_sucursal') {
    const sucMap = {};
    data.forEach(p => {
      const suc = p.sucursales?.nombre || 'WEB';
      if(!sucMap[suc]) sucMap[suc] = {count:0, total:0};
      sucMap[suc].count++;
      sucMap[suc].total += parseFloat(p.total)||0;
    });
    headers = ['Sucursal','Cantidad presupuestos','Total estimado'];
    rows = Object.entries(sucMap).map(([s,v])=>[s, v.count, Math.round(v.total)]);
  } else if(tipo === 'por_vendedor') {
    const vendMap = {};
    data.forEach(p => {
      const v = p.vendedor_nombre || 'Sin asignar';
      if(!vendMap[v]) vendMap[v] = {count:0, total:0};
      vendMap[v].count++;
      vendMap[v].total += parseFloat(p.total)||0;
    });
    headers = ['Vendedor','Cantidad presupuestos','Total estimado'];
    rows = Object.entries(vendMap).map(([v,d])=>[v, d.count, Math.round(d.total)]);
  } else {
    headers = ['#','Fecha','Cliente','Teléfono','Sucursal','Vendedor','Plan','Total'];
    rows = data.map(p => [
      p.id,
      p.fecha ? new Date(p.fecha).toLocaleDateString('es-AR') : '',
      p.clientes?.nombre||'',
      p.clientes?.telefono||'',
      p.sucursales?.nombre||'WEB',
      p.vendedor_nombre||'',
      p.plan_pago||'',
      Math.round(p.total||0),
    ]);
  }

  const ws = window.XLSX.utils.aoa_to_sheet([headers, ...rows]);
  wb = window.XLSX.utils.book_new();
  window.XLSX.utils.book_append_sheet(wb, ws, 'Reporte');
  window.XLSX.writeFile(wb, `reporte_munoz_${Date.now()}.xlsx`);
  closeModal();
  showToast('Excel generado','success');
}

  win.document.close();

function escAdm(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function previewVideo() {
  const url = document.getElementById('video-url-nuevo')?.value.trim();
  const vid = document.getElementById('preview-video');
  if (vid && url) { vid.src = url; vid.load(); }
}

async function actualizarVideo() {
  const url = document.getElementById('video-url-nuevo')?.value.trim();
  if (!url) { showToast('Ingresá una URL', 'error'); return; }
  try {
    await sb('config_app?clave=eq.video_portada_url', {
      method: 'PATCH', prefer: 'return=minimal',
      body: { valor: url }
    });
    document.getElementById('video-url-actual').value = url;
    document.getElementById('video-url-nuevo').value = '';
    const vid = document.getElementById('preview-video');
    if (vid) { vid.src = url; vid.load(); }
    showToast('Video actualizado correctamente', 'success');
  } catch(e) { showToast('Error al actualizar', 'error'); console.error(e); }
}


async function renderPortadaWeb() {
  // Load current config
  let tipo = 'video', videoUrl = '', imagenesRaw = '';
  try {
    const res = await sb('config_app?select=clave,valor&clave=in.(web_hero_tipo,web_hero_video_url,web_hero_imagenes)');
    const map = {};
    (res||[]).forEach(r=>map[r.clave]=r.valor);
    tipo        = map['web_hero_tipo']      || 'video';
    videoUrl    = map['web_hero_video_url'] || '';
    imagenesRaw = map['web_hero_imagenes']  || '';
  } catch(e) { console.error(e); }

  const imagenes = imagenesRaw.split(',').map(s=>s.trim()).filter(Boolean);

  document.getElementById('content').innerHTML = `

      <div style="display:flex;border:1.5px solid var(--border);overflow:hidden;width:fit-content">

        <button id="tab-imagenes" onclick="switchPortadaTab('imagenes')" style="height:38px;padding:0 24px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;border-left:1.5px solid var(--border);${tipo==='imagenes'?'background:var(--blue);color:#fff;border-left-color:var(--blue)':'background:var(--white);color:var(--text-2)'}">Imágenes</button>
      </div>
    </div>

    <!-- VIDEO TAB -->

        <div style="font-size:15px;font-weight:700;margin-bottom:20px">Video de portada (horizontal)</div>

          <input id="web-video-actual" value="${videoUrl||'Sin video configurado'}" disabled style="background:#eee;font-size:12px"/>

            Subir video
            <input type="file" accept="video/*" style="display:none" onchange="subirArchivoWeb(this,'web-video-nuevo','video',previewWebVideo)"/>

function switchPortadaTab(tab) {
  const isVideo = tab === 'video';
  document.getElementById('portada-tab-video').style.display = isVideo ? 'grid' : 'none';
  document.getElementById('portada-tab-imagenes').style.display = isVideo ? 'none' : 'block';
  document.getElementById('tab-video').style.cssText += isVideo ? ';background:var(--blue);color:#fff' : ';background:var(--white);color:var(--text-2)';
  document.getElementById('tab-imagenes').style.cssText += isVideo ? ';background:var(--white);color:var(--text-2)' : ';background:var(--blue);color:#fff';
  window._portadaTab = tab;
}

function previewWebVideo() {
  const url = document.getElementById('web-video-nuevo')?.value.trim();
  const vid = document.getElementById('web-video-preview');
  if(vid && url) { vid.src = url; vid.load(); }
}

async function subirArchivoWeb(input, targetId, tipo, callback) {
  const file = input?.files?.[0];
  if(!file) return;
  const status = document.getElementById('web-video-status');
  if(status) status.textContent = 'Subiendo…';

  const ext = file.name.split('.').pop().toLowerCase();
  const filename = `web_${Date.now()}.${ext}`;
  const url = `${SB_URL}/storage/v1/object/imagenes/${filename}`;

  try {
    const res = await fetch(url, {
      method:'POST',
      headers:{'Authorization':`Bearer ${SB_KEY}`,'Content-Type':file.type,'x-upsert':'true'},
      body: file,
    });
    if(!res.ok) throw new Error(await res.text());
    const publicUrl = `${SB_URL}/storage/v1/object/public/imagenes/${filename}`;
    const target = document.getElementById(targetId);
    if(target) target.value = publicUrl;
    if(callback) callback();
    if(status) { status.textContent = '✓ Subido'; status.style.color='var(--green)'; setTimeout(()=>{if(status)status.textContent='';},3000); }
  } catch(e) {
    console.error(e);
    if(status) { status.textContent = '✗ Error'; status.style.color='var(--red)'; }
  }
}

function agregarImagenPortada() {
  const url = document.getElementById('img-nueva-url')?.value.trim();
  if(!url) return;
  if(!window._portadaImagenes) window._portadaImagenes = [];
  window._portadaImagenes.push(url);
  document.getElementById('img-nueva-url').value = '';
  // Re-render list
  const list = document.getElementById('imagenes-portada-list');
  if(list) list.innerHTML = window._portadaImagenes.map((img,i)=>`
    <div style="display:flex;align-items:center;gap:8px;padding:8px;background:var(--off-white);border:1.5px solid var(--border)">
      <img src="${img}" style="width:60px;height:40px;object-fit:cover;flex-shrink:0" onerror="this.style.display='none'"/>
      <div style="flex:1;font-size:12px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${img}</div>
      <button onclick="eliminarImagenPortada(${i})" style="width:28px;height:28px;background:#fdecea;color:var(--red);font-size:16px;border:none;cursor:pointer;flex-shrink:0">✕</button>
    </div>`).join('');
}

function eliminarImagenPortada(idx) {
  window._portadaImagenes.splice(idx, 1);
  agregarImagenPortada(); // trigger re-render with empty url
  document.getElementById('img-nueva-url').value = '';
}

async function guardarPortadaWeb() {
  const tab = window._portadaTab || (document.getElementById('portada-tab-video').style.display !== 'none' ? 'video' : 'imagenes');
  const updates = [];

  if(tab === 'video') {
    const url = document.getElementById('web-video-nuevo')?.value.trim();
    if(url) updates.push({ clave:'web_hero_video_url', valor:url });
    updates.push({ clave:'web_hero_tipo', valor:'video' });
  } else {
    updates.push({ clave:'web_hero_tipo', valor:'imagenes' });
    updates.push({ clave:'web_hero_imagenes', valor:(window._portadaImagenes||[]).join(',') });
  }

  for(const u of updates) {
    await sb(`config_app?clave=eq.${u.clave}`, {method:'PATCH', body:{valor:u.valor}, prefer:'return=minimal'});
  }

  showToast('Portada actualizada', 'success');
  renderPortadaWeb();
}

async function loadPresupuestos() {
  const search = document.getElementById('pres-search')?.value.trim()||'';
  const from   = document.getElementById('pres-from')?.value;
  const to     = document.getElementById('pres-to')?.value;

  const sucId = document.getElementById('pres-suc')?.value;
  let query = 'presupuestos?select=*,clientes(nombre,telefono),sucursales(nombre)&order=fecha.desc&limit=200';
  if (from)  query += `&fecha=gte.${from}T00:00:00`;
  if (to)    query += `&fecha=lte.${to}T23:59:59`;
  if (sucId) query += `&sucursal_id=eq.${sucId}`;

  const res = await sb(query);
  let data  = res || [];
  if (search) data = data.filter(p=>(p.clientes?.nombre||'').toLowerCase().includes(search.toLowerCase()));

  const rows = data.map(p => {
    const fecha = p.fecha ? new Date(p.fecha).toLocaleString('es-AR',{timeZone:'America/Argentina/Buenos_Aires'}) : '—';
    const nombre = p.clientes?.nombre || '—';
    const tel    = p.clientes?.telefono || '—';
    const sucNombre = p.sucursales?.nombre || (p.sucursal_id ? '—' : 'WEB');
    return `
      <tr>
        <td>${p.id}</td>
        <td><div style="font-weight:600">${nombre}</div><div style="font-size:11px;color:var(--text-3)">${tel}</div></td>
        <td style="font-size:12px">${sucNombre}</td>
        <td style="font-size:12px">${p.vendedor_nombre||'—'}</td>
        <td>${p.plan_pago||'—'}</td>
        <td>$${Math.round(p.total||0).toLocaleString('es-AR')}</td>
        <td style="font-size:12px">${fecha}</td>
        <td class="td-actions">
          <button class="btn-sm btn-edit" onclick="verPresupuesto(${p.id})">Ver / Imprimir</button>
        </td>
      </tr>
    `;
  }).join('');

  document.getElementById('pres-table-wrap').innerHTML = `
    <table>
      <thead><tr><th>#</th><th>Cliente</th><th>Plan</th><th>Total</th><th>Fecha</th><th>Acciones</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-3)">Sin presupuestos</td></tr>'}</tbody>
    </table>
  `;
}

  `, [
    { label:'Cancelar', cls:'btn-sm', action: closeModal },
    { label:'Crear sucursal', cls:'btn-sm btn-edit', action: crearSucursal },

}

async function crearSucursal() {
  const nombre = document.getElementById('s-nombre').value.trim();
  const user   = document.getElementById('s-user').value.trim();
  const pass   = document.getElementById('s-pass').value.trim();
  if (!nombre || !user || !pass) { showToast('Nombre, usuario y contraseña son obligatorios','error'); return; }
  await sb('sucursales', {
    method:'POST', prefer:'return=minimal',
    body:{
      nombre, ciudad:document.getElementById('s-ciudad').value.trim(),
      direccion:document.getElementById('s-dir').value.trim(),
      email:document.getElementById('s-email').value.trim(),
      telefono:document.getElementById('s-tel').value.trim(),
      username:user, password:pass, activa:true, conectada:false,
    }
  });
  closeModal();
  await loadBaseData();
  renderSucursales();
  showToast('Sucursal creada','success');
}

function editSucursal(id) {
  const s = sucursales.find(x=>x.id===id);
  if (!s) return;
  openModal('Editar sucursal', `
    <div class="form-row">
      <div class="form-group"><label>Nombre</label><input id="s-nombre" value="${esc(s.nombre||'')}"/></div>
      <div class="form-group"><label>Ciudad</label><input id="s-ciudad" value="${esc(s.ciudad||'')}"/></div>
    </div>
    <div class="form-group"><label>Dirección</label><input id="s-dir" value="${esc(s.direccion||'')}"/></div>
    <div class="form-row">
      <div class="form-group"><label>Email</label><input id="s-email" value="${esc(s.email||'')}"/></div>
      <div class="form-group"><label>Teléfono</label><input id="s-tel" value="${esc(s.telefono||'')}"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Usuario</label><input id="s-user" value="${esc(s.username||'')}"/></div>
      <div class="form-group"><label>Nueva contraseña (dejar vacío para no cambiar)</label><input id="s-pass" type="password" placeholder="Nueva contraseña"/></div>
    </div>

    { label:'Cancelar', cls:'btn-sm', action: closeModal },
    { label:'Guardar', cls:'btn-sm btn-edit', action: ()=>guardarSucursal(id, s.password) },

async function guardarSucursal(id, oldPass) {
  const pass = document.getElementById('s-pass').value.trim();
  const payload = {
    nombre:    document.getElementById('s-nombre').value.trim(),
    ciudad:    document.getElementById('s-ciudad').value.trim(),
    direccion: document.getElementById('s-dir').value.trim(),
    email:     document.getElementById('s-email').value.trim(),
    telefono:  document.getElementById('s-tel').value.trim(),
    username:  document.getElementById('s-user').value.trim(),
    password:  pass || oldPass,
  };
  await sb(`sucursales?id=eq.${id}`, {method:'PATCH', body:payload, prefer:'return=minimal'});
  closeModal(); await loadBaseData(); renderSucursales();
  showToast('Sucursal actualizada','success');
}

async function eliminarSucursal(id) {
  if (!confirm('¿Eliminar esta sucursal? Esta acción no se puede deshacer.')) return;
  await sb(`sucursales?id=eq.${id}`, {method:'DELETE'});
  await loadBaseData(); renderSucursales();
  showToast('Sucursal eliminada', 'success');
}

async function toggleSucursal(id, current) {
  await sb(`sucursales?id=eq.${id}`, {method:'PATCH', body:{activa:!current, conectada:false}, prefer:'return=minimal'});
  await loadBaseData(); renderSucursales();
  showToast(!current ? 'Sucursal reactivada' : 'Sucursal derogada', 'success');
}

async function subirImagenArticulo() {
  const input  = document.getElementById('img-upload-input');
  const status = document.getElementById('img-upload-status');
  const file   = input?.files?.[0];
  if (!file) return;

  status.textContent = 'Subiendo…';
  status.style.color = 'var(--text-3)';

  try {
    // Sanitize filename
    const ext      = file.name.split('.').pop().toLowerCase();
    const filename = `art_${Date.now()}.${ext}`;
    const url      = `${SB_URL}/storage/v1/object/imagenes/${filename}`;

    const res = await fetch(url, {
      method:  'POST',
      headers: {
        'Authorization': `Bearer ${SB_KEY}`,
        'Content-Type':  file.type,
        'x-upsert':      'true',
      },
      body: file,
    });

    if (!res.ok) {
      const err = await res.text();
      throw new Error(err);
    }

    // Build public URL
    const publicUrl = `${SB_URL}/storage/v1/object/public/imagenes/${filename}`;

    // Set in input and preview
    const imgInput = document.getElementById('e-img');
    if (imgInput) imgInput.value = publicUrl;
    previewArticuloImg();

    status.textContent = '✓ Subida exitosa';
    status.style.color = 'var(--green)';
    setTimeout(() => { if(status) status.textContent = ''; }, 3000);

  } catch(e) {
    console.error('Upload error:', e);
    status.textContent = '✗ Error al subir';
    status.style.color = 'var(--red)';
  }
}

function previewArticuloImg() {
  const url  = document.getElementById('e-img')?.value.trim();
  const wrap = document.getElementById('img-preview-wrap');
  if (!wrap) return;
  if (url) {
    wrap.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:contain" onerror="this.parentElement.innerHTML='<span style=color:var(--text-3);font-size:12px;padding:8px>URL inválida</span>'"/>`;
  } else {
    wrap.innerHTML = '<span style="color:var(--text-3);font-size:12px;text-align:center;padding:8px">Sin imagen</span>';
  }
}

// ══════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════
function formatCodigo(c) {
  const n = String(c).split('.')[0].replace(/[^0-9]/g,'');
  return n.length === 4 ? '0'+n : n;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  setTimeout(()=>t.classList.remove('show'), 3000);
}

function openModal(title, body, buttons=[]) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-footer').innerHTML = buttons.map((b,i)=>
    `<button class="btn-sm ${b.cls}" id="modal-btn-${i}">${b.label}</button>`
  ).join('');
  buttons.forEach((b,i)=>{
    document.getElementById(`modal-btn-${i}`).addEventListener('click', b.action);
  });
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

document.getElementById('modal-overlay').addEventListener('click', e=>{
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});
</script>
